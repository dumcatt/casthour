; nvenc-proxy settings. Place next to nvEncodeAPI64.dll in the game's modules\ folder.

[proxy]
; live     = stream everything the game shows (menus, demo play, songs, results) with its audio
; recorder = stream only what the game's own play recorder writes to its MP4
mode=live
; Real NVENC DLL to forward to. Empty = %SystemRoot%\System32\nvEncodeAPI64.dll (NVIDIA driver).
; To chain to another replacement (e.g. an AMD AMF shim), rename it and name it here.
real_dll=
; Writes nvenc-proxy.log next to the DLL.
log=1

[output]
; OBS connects here with a Media Source: tcp://<game PC IP>:9910  (empty = off)
tcp_listen=0.0.0.0:9910
; Push MPEG-TS over UDP instead/as well, e.g. 192.168.1.20:9911 (OBS input: udp://@:9911)
udp_target=
; Also write the live stream to a local .ts file; {time} becomes the start time.
;   file=casthour-{time}.ts
file=
; Recorder mode only: force a keyframe every N ms (0 = only when a viewer connects).
; Defaults to 2000 when udp_target is set.
;keyframe_interval_ms=0

[capture]
; Live mode encoder (our own NVENC session; the game's recorder is untouched).
fps=60
; 0 = the game's resolution (1920x1080)
width=0
height=0
bitrate_kbps=12000
gop_seconds=2
; While the game's recorder is running, stream its frame instead of the screen. The game leaves
; CREDITS, the arcade name and leaderboard names out of that frame by itself.
use_game_frame=1
; Also apply the [masks] below on top of the recorder frame.
mask_game_frame=0
; 1 = draw the masks as green outlines instead of hiding anything, to line them up.
mask_preview=0

[audio]
enabled=1
; Tap the game's output stream; whichever one the game actually uses is picked automatically.
asio=1
wasapi=1
; Find the ASIO driver's code by constructing it once at startup (no init, the device is not
; opened). Set to 0 if your ASIO driver misbehaves; it is then hooked when the game creates it.
asio_probe=1
; AAC bitrate: 96, 128, 160 or 192.
bitrate_kbps=192
; Shift audio relative to video in the stream only (never affects the game). +ms = later.
offset_ms=0

[masks]
; Areas hidden while the screen (not the recorder frame) is streamed: menus, demo play, results
; outside a recording. Format: name=x,y,width,height[,pixelate]  in 1920x1080 pixels, scaled to
; the output size. Default is a solid black box. Line them up with mask_preview=1. Examples only:
;credits=760,1030,400,50
;arcade_name=0,0,480,60,pixelate
;leaderboard_names=1180,300,500,520,pixelate
