name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.bat

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          if (-not (Test-Path dist\nvEncodeAPI64.dll)) { throw 'build produced no DLL' }
          gh release create $tag dist\nvEncodeAPI64.dll --title $tag --generate-notes
